# app/ 配下の Flutter アプリ (inference / logger) の CI。フォーマット・静的解析・
# ユニットテストのみで、APK/IPA のビルドは行わない (署名やモデルアセットが必要なため)。
#
# 注意:
# - inference の assets/{models,clip}/ の ONNX モデルは git 管理外だが、pubspec は
#   ディレクトリごと宣言しているので README だけでもテストは通る (欠けている場合は
#   アプリがダミー軌道にフォールバックする設計)。logger はモデルアセットを持たない。
# - inference の lib/src/grpc/gen/ は scripts/gen_proto.sh が生成するコミット済み
#   スタブ。フォーマットチェックの対象外とする (logger には gen/ が無いので no-op)。
name: ci-flutter

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'proto/edge_action.proto'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'proto/edge_action.proto'
      - '.github/workflows/ci-flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [inference, logger]
    defaults:
      run:
        working-directory: app/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format check (生成コードを除く)
        run: |
          git ls-files -z '*.dart' ':!lib/src/grpc/gen' |
            xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
